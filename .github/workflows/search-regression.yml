name: Search Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Compare search responses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Configure kernel for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start OpenSearch
        run: docker compose up -d --wait opensearch
      - name: Run tests and regression comparison
        run: mvn -B verify -Pregression
      - name: Show OpenSearch logs
        if: failure()
        run: docker compose logs opensearch
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-reports
          path: api/target/failsafe-reports
      - name: Stop OpenSearch
        if: always()
        run: docker compose down -v
