name: Search Compare

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 比較するPRの番号
        required: true
        type: number

concurrency:
  group: search-compare-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  compare:
    name: Compare main and pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.compare.outputs.summary }}
      counts: ${{ steps.compare.outputs.counts }}
      mismatches: ${{ steps.compare.outputs.mismatches }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false
      - name: Check out main for merging
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Merge pull request into main
        working-directory: head
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: bash ../tools/.github/scripts/merge_pull_request.sh "$PR_NUMBER"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: base/**/pom.xml
      - name: Build main
        working-directory: base
        run: mvn -B -DskipTests package
      - name: Build pull request
        working-directory: head
        run: mvn -B -DskipTests package
      - name: Configure kernel for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start OpenSearch
        run: docker compose -f base/compose.yml up -d --wait opensearch
      - name: Compare responses
        id: compare
        run: >-
          python3 tools/.github/scripts/compare_search.py
          --base-jar base/api/target/opensearch-sandbox-api-1.0.0-SNAPSHOT.jar
          --head-jar head/api/target/opensearch-sandbox-api-1.0.0-SNAPSHOT.jar
          --resources base/api/src/integration-test/resources/regression
          --output-dir compare-results
          --environment docker
      - name: Show OpenSearch logs
        if: failure()
        run: docker compose -f base/compose.yml logs opensearch
      - name: Upload comparison results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: search-compare-results
          path: compare-results
      - name: Stop OpenSearch
        if: always()
        run: docker compose -f base/compose.yml down -v

  status:
    name: Report result to pull request
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Find pull request commit
        id: pull-request
        run: |
          sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Write commit status
        env:
          RESULT: ${{ needs.compare.result }}
          SUMMARY: ${{ needs.compare.outputs.summary }}
          SHA: ${{ steps.pull-request.outputs.sha }}
        run: |
          state=failure
          description="比較を実行できませんでした"
          if [ -n "$SUMMARY" ]; then
            description="$SUMMARY"
          fi
          if [ "$RESULT" = "success" ]; then
            state=success
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=search-compare \
            -f description="$description" \
            -f target_url="$RUN_URL"
      - name: Update pull request comment
        env:
          COUNTS: ${{ needs.compare.outputs.counts }}
          MISMATCHES: ${{ needs.compare.outputs.mismatches }}
          COMMIT: ${{ steps.pull-request.outputs.sha }}
        run: python3 tools/.github/scripts/pr_comment.py
