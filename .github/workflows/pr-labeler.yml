name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-24.04
    steps:
      - name: Label based on changed files
        uses: actions/labeler@v6.2.0
        with:
          configuration-path: .github/labeler.yml
